framework:
    secret: '%env(APP_SECRET)%'
    http_method_override: false
    handle_all_throwables: true
    php_errors:
        log: true
    session:
        enabled: true
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax
        storage_factory_id: session.storage.factory.native
    test: false
    router:
        utf8: true
    csrf_protection: false
    form:
        enabled: true
    validation:
        enabled: true
    annotations: false
    serializer:
        enabled: false
    default_locale: en
    enabled_locales: ['en', 'fr']
